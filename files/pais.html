<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal dos Pais - Alcateia Kotick - Acompanhe atividades, comunicados e confirme presença">
  <title>Alcateia Kotick — Portal dos Pais</title>
  <link rel="icon" type="image/png" href="images/logo-alcateia.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pais.css">
  <script>
    // Aplica o tema antes do render para evitar flash
    (function() {
      var saved = localStorage.getItem('paisTheme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark-init');
    })();
  </script>
  <style>
    /* Aplicado imediatamente no <html> para evitar flash branco */
    .dark-init { background: #0f1117; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <button class="btn-theme" id="btn-theme" onclick="toggleTheme()" aria-label="Alternar tema">
    <svg id="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg id="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
  <div class="header-brand">
    <div class="header-brand-text">
      <div class="group">Grupo Escoteiro Hokkaido</div>
      <div class="name">Alcateia Kotick · 80/SP</div>
    </div>
  </div>
  <div class="header-title">Portal dos Pais</div>
  <div class="header-sub">Acompanhe as atividades da alcateia</div>
</header>

<!-- NAV TABS -->
<nav class="nav-tabs" role="tablist" aria-label="Seções do portal">
  <button class="nav-tab active" id="tab-comunicados" role="tab" aria-selected="true" aria-controls="p-comunicados" onclick="showTab('comunicados')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Comunicados
  </button>
  <button class="nav-tab" id="tab-calendario" role="tab" aria-selected="false" aria-controls="p-calendario" onclick="showTab('calendario')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Calendário
  </button>
  <button class="nav-tab" id="tab-confirmar" role="tab" aria-selected="false" aria-controls="p-confirmar" onclick="showTab('confirmar')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
    Confirmar Presença
  </button>
</nav>

<!-- COMUNICADOS PAGE -->
<div class="page active" id="p-comunicados" role="tabpanel" aria-labelledby="tab-comunicados" tabindex="0">
  <div id="com-lista-pais" aria-live="polite" aria-busy="true">
    <div class="empty"><div class="icon" aria-hidden="true">📢</div><p>Carregando comunicados...</p></div>
  </div>
</div>

<!-- CALENDÁRIO PAGE -->
<div class="page" id="p-calendario" role="tabpanel" aria-labelledby="tab-calendario" tabindex="0">
  <div class="legend">
    <span style="display:flex;align-items:center;gap:4px"><span class="legend-dot" style="background:#4caf50"></span>Normal Sede</span>
    <span style="display:flex;align-items:center;gap:4px"><span class="legend-dot" style="background:#1e88e5"></span>Local</span>
    <span style="display:flex;align-items:center;gap:4px"><span class="legend-dot" style="background:#f9a825"></span>Externa</span>
    <span style="display:flex;align-items:center;gap:4px"><span class="legend-dot" style="background:#8e24aa"></span>Regional/Distrital</span>
    <span style="display:flex;align-items:center;gap:4px"><span class="legend-dot" style="background:#ef5350;opacity:0.5"></span>Feriado</span>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    <button class="filter-btn active" onclick="filterCalPais('todos',this)">Todos</button>
    <button class="filter-btn" onclick="filterCalPais('proximas',this)">Próximas</button>
    <button class="filter-btn" onclick="filterCalPais('Local',this)">Local</button>
    <button class="filter-btn" onclick="filterCalPais('Distrital',this)">Distrital</button>
    <button class="filter-btn" onclick="filterCalPais('Regional',this)">Regional</button>
  </div>
  <div id="cal-lista-pais" aria-live="polite">
    <div class="empty"><div class="icon" aria-hidden="true">📅</div><p>Carregando calendário...</p></div>
  </div>
</div>

<!-- CONFIRMAR PAGE -->
<div class="page" id="p-confirmar" role="tabpanel" aria-labelledby="tab-confirmar" tabindex="0">
  <div id="conf-content" aria-live="polite">
    <div class="empty"><div class="icon" aria-hidden="true">✅</div><p>Carregando atividades...</p></div>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="pais.js"></script>
</body>
</html>
