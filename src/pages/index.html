<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal da Alcateia Kotick - Grupo Escoteiro Hokkaido 80/SP">
  <meta name="keywords" content="escoteiros, alcateia, kotick, hokkaido">
  <title>Alcateia Kotick — Portal</title>
  <link rel="icon" type="image/png" href="/images/logo-alcateia.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/index.css">
  <script>
    (function() {
      var saved = localStorage.getItem('alcateiaTheme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark-init');
    })();
  </script>
  <style>.dark-init { background: #0f1117; }</style>
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <img src="/assets/images/logo-alcateia.png" alt="Logo Alcateia Kotick" width="120" height="120">
      </div>
      <h1>Alcateia Kotick</h1>
      <div class="subtitle">Portal Alcateia Kotick</div>
      <div class="group">Grupo Escoteiro Hokkaido · 80/SP</div>
    </header>

    <main class="cards">
      <a href="/pais.html" class="card" aria-label="Acessar Portal dos Pais">
        <div class="card-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="9" cy="7" r="3"/><circle cx="17" cy="7" r="3"/>
            <path d="M2 23v-1a7 7 0 0 1 7-7h8a7 7 0 0 1 7 7v1"/>
          </svg>
        </div>
        <div class="card-content">
          <div class="card-title">Portal dos Pais</div>
          <div class="card-desc">Comunicados, calendário e confirmação de presença</div>
        </div>
      </a>

      <a href="/chefia-login.html" class="card" aria-label="Acessar Portal da Chefia">
        <div class="card-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L2 7v7c0 6 5 10 11 11 6-1 11-5 11-11V7L13 2z"/>
            <polyline points="9,13 12,16 17,11"/>
          </svg>
        </div>
        <div class="card-content">
          <div class="card-title">Portal da Chefia</div>
          <div class="card-desc">Gestão de atividades, comunicados e presenças</div>
        </div>
      </a>
    </main>

    <footer class="footer">
      <p>Melhor Possível!</p>
    </footer>
  </div>
  <button class="btn-theme" id="btn-theme" onclick="toggleTheme()" aria-label="Alternar tema">
    <svg id="ti-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg id="ti-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
  <script>
    function toggleTheme() {
      var isDark = document.body.classList.toggle('dark');
      localStorage.setItem('alcateiaTheme', isDark ? 'dark' : 'light');
      document.getElementById('ti-moon').style.display = isDark ? 'none' : '';
      document.getElementById('ti-sun').style.display  = isDark ? ''     : 'none';
    }
    (function() {
      var saved = localStorage.getItem('alcateiaTheme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var isDark = saved === 'dark' || (!saved && prefersDark);
      document.documentElement.classList.remove('dark-init');
      if (isDark) {
        document.body.classList.add('dark');
        document.getElementById('ti-moon').style.display = 'none';
        document.getElementById('ti-sun').style.display  = '';
      }
    })();
  </script>
</body>

</html>
