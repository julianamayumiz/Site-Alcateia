<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login - Portal da Chefia - Alcateia Kotick">
  <title>Alcateia Kotick · Login Chefia</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b3a8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chefia">
  <link rel="apple-touch-icon" href="../images/logo_jpeg.jpeg">
  <link rel="icon" type="image/jpeg" href="../images/logo_jpeg.jpeg">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="../scripts/firebase-config.js"></script>

  <script>
    (function() {
      var saved = localStorage.getItem('alcateiaTheme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark-init');
    })();
  </script>
  <style>.dark-init { background: #0f1117; }</style>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --border: #d6dcea;
      --text: #12183a;
      --text2: #5a6480;
      --accent: #2b3a8c;
      --accent-hover: #1f2b6b;
      --red: #c0392b;
      --red-light: #fce8e6;
      --surface2: #edf0f8;
      --text3: #677090;
      --radius-sm: 6px;
      --radius: 10px;
    }

    body.dark {
      --bg: #0f1117;
      --surface: #181b2a;
      --surface2: #1e2236;
      --border: #2a304d;
      --text: #e8ebf5;
      --text2: #9ba6c8;
      --text3: #7282ab;
      --accent: #5472e4;
      --accent-hover: #4060d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo { margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .subtitle { font-size: 14px; color: var(--text2); margin-bottom: 32px; }

    .btn-google {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .btn-google:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(43,58,140,0.1); }
    .btn-google:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-message {
      background: var(--red-light);
      color: var(--red);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      text-align: left;
    }
    .error-message.show { display: block; }

    .info-text {
      font-size: 12px;
      color: var(--text2);
      margin-top: 20px;
      padding: 12px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
    }

    .back-link { margin-top: 24px; font-size: 13px; }
    .back-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="logo">
      <svg width="48" height="48" viewBox="0 0 52 52" fill="none" aria-hidden="true">
        <path d="M26 4L6 12v16c0 11 9.5 18 20 20 10.5-2 20-9 20-20V12L26 4z" fill="#2b3a8c" stroke="#2b3a8c" stroke-width="1.5" stroke-linejoin="round"/>
        <polygon points="26,16 28.4,22.8 35.5,22.9 29.8,27.2 31.9,34.1 26,30 20.1,34.1 22.2,27.2 16.5,22.9 23.6,22.8" fill="white"/>
      </svg>
    </div>
    <h1>Portal da Chefia</h1>
    <div class="subtitle">Acesso restrito &middot; conta @escoteiros.org.br</div>

    <div class="error-message" id="errorMessage"></div>

    <button type="button" class="btn-google" id="btnGoogle">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.17-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.96 10.71A5.41 5.41 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      <span id="btnText">Entrar com Google</span>
    </button>

    <div class="info-text">
      Apenas contas <strong>@escoteiros.org.br</strong> tem acesso ao portal.
    </div>

    <div class="back-link">
      <a href="index.html">&larr; Voltar para pagina inicial</a>
    </div>
  </div>

  <script>
    (function() {
      var saved = localStorage.getItem('alcateiaTheme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.body.classList.add('dark');
      }
      document.documentElement.classList.remove('dark-init');
    })();

    if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
    var DOM = window.ALCATEIA_EMAIL_DOMAIN || 'escoteiros.org.br';
    var auth = firebase.auth();
    var btn = document.getElementById('btnGoogle');
    var btnText = document.getElementById('btnText');
    var errEl = document.getElementById('errorMessage');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.classList.add('show');
    }
    function clearError() { errEl.classList.remove('show'); }

    // Se ja esta logado com dominio correto, redireciona
    auth.onAuthStateChanged(function(user){
      if (user && (user.email || '').toLowerCase().endsWith('@' + DOM)) {
        window.location.href = 'chefia.html';
      }
    });

    btn.addEventListener('click', function() {
      clearError();
      btn.disabled = true;
      btnText.textContent = 'Entrando...';
      var provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ hd: DOM });
      auth.signInWithPopup(provider).then(function(result) {
        var email = (result.user && result.user.email || '').toLowerCase();
        if (!email.endsWith('@' + DOM)) {
          return auth.signOut().then(function(){
            showError('Acesso permitido apenas para contas @' + DOM + '.');
            btn.disabled = false;
            btnText.textContent = 'Entrar com Google';
          });
        }
        window.location.href = 'chefia.html';
      }).catch(function(err) {
        console.warn(err);
        if (err && err.code === 'auth/popup-closed-by-user') {
          clearError();
        } else {
          showError('Nao foi possivel entrar: ' + (err && err.message || 'erro desconhecido'));
        }
        btn.disabled = false;
        btnText.textContent = 'Entrar com Google';
      });
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>

</html>
