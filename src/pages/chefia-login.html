<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login - Portal da Chefia - Alcateia Kotick">
  <title>Alcateia Kotick · Login Chefia</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b3a8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chefia">
  <link rel="apple-touch-icon" href="../images/logo_jpeg.jpeg">
  <link rel="icon" type="image/jpeg" href="../images/logo_jpeg.jpeg">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" integrity="sha384-ajMUFBUFMCyjh8uxJg6bkGcKe9RTolyjwbxB3yES0QQMenP3Oztj/W9vA2SJPcIh" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" integrity="sha384-xD1t9dGSVKobUztxDkv6xUI0H4AnFz0NxwlgDJJ7FDlblG9xxr1Z9iauCZuJYj6p" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js" integrity="sha384-f6/UpzjTjIXASlp20cArQsaRh1EvHVJd5kegy/gYR9W2D0a32TnEqUEiW4Zm/5O0" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
  <script src="../scripts/firebase-config.js"></script>

  <script>
    (function() {
      var saved = localStorage.getItem('alcateiaTheme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark-init');
    })();
  </script>
  <style>.dark-init { background: #0f1117; }</style>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --border: #d6dcea;
      --text: #12183a;
      --text2: #5a6480;
      --accent: #2b3a8c;
      --accent-hover: #1f2b6b;
      --red: #c0392b;
      --red-light: #fce8e6;
      --green: #1e7e34;
      --green-light: #e6f4ea;
      --surface2: #edf0f8;
      --text3: #677090;
      --radius-sm: 6px;
      --radius: 10px;
    }

    body.dark {
      --bg: #0f1117;
      --surface: #181b2a;
      --surface2: #1e2236;
      --border: #2a304d;
      --text: #e8ebf5;
      --text2: #9ba6c8;
      --text3: #7282ab;
      --accent: #5472e4;
      --accent-hover: #4060d4;
      --red-light: #3a2222;
      --green-light: #1f3326;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .logo { margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .subtitle { font-size: 14px; color: var(--text2); margin-bottom: 28px; }

    form { text-align: left; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
    }
    .field input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      top: 0; right: 0;
      height: 100%;
      width: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      padding: 0;
    }
    .pw-toggle:hover { color: var(--accent); }
    .pw-toggle .eye-off { display: none; }
    .pw-toggle.on .eye-on { display: none; }
    .pw-toggle.on .eye-off { display: block; }

    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .link-btn {
      display: inline-block;
      margin-top: 14px;
      background: none;
      border: none;
      color: var(--accent);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
    }
    .link-btn:hover { text-decoration: underline; }

    .msg {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      text-align: left;
    }
    .msg.show { display: block; }
    .msg.error { background: var(--red-light); color: var(--red); }
    .msg.ok { background: var(--green-light); color: var(--green); }

    .hint {
      font-size: 12px;
      color: var(--text2);
      margin-top: 20px;
      padding: 12px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      text-align: left;
    }

    .back-link { margin-top: 22px; font-size: 13px; }
    .back-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="logo">
      <svg width="48" height="48" viewBox="0 0 52 52" fill="none" aria-hidden="true">
        <path d="M26 4L6 12v16c0 11 9.5 18 20 20 10.5-2 20-9 20-20V12L26 4z" fill="#2b3a8c" stroke="#2b3a8c" stroke-width="1.5" stroke-linejoin="round"/>
        <polygon points="26,16 28.4,22.8 35.5,22.9 29.8,27.2 31.9,34.1 26,30 20.1,34.1 22.2,27.2 16.5,22.9 23.6,22.8" fill="white"/>
      </svg>
    </div>
    <h1 id="tituloPainel">Portal da Chefia</h1>
    <div class="subtitle" id="subtitloPainel">Acesso restrito &middot; use seu e-mail e senha</div>

    <div class="msg" id="msg"></div>

    <!-- PAINEL: LOGIN -->
    <form id="formLogin">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="username" placeholder="voce@escoteiros.org.br" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <div class="pw-wrap">
          <input type="password" id="senha" autocomplete="current-password" placeholder="Sua senha" required>
          <button type="button" class="pw-toggle" data-target="senha" aria-label="Mostrar senha">
            <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="btnEntrar">Entrar</button>
      <div style="text-align:center">
        <button type="button" class="link-btn" id="btnEsqueci">Esqueci minha senha</button>
      </div>
    </form>

    <!-- PAINEL: TROCA DE SENHA OBRIGATÓRIA -->
    <form id="formSenha" style="display:none">
      <div class="field">
        <label for="novaSenha">Nova senha (mínimo 8 caracteres)</label>
        <div class="pw-wrap">
          <input type="password" id="novaSenha" autocomplete="new-password" placeholder="Escolha uma senha" required>
          <button type="button" class="pw-toggle" data-target="novaSenha" aria-label="Mostrar senha">
            <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="confirmaSenha">Confirme a nova senha</label>
        <div class="pw-wrap">
          <input type="password" id="confirmaSenha" autocomplete="new-password" placeholder="Repita a senha" required>
          <button type="button" class="pw-toggle" data-target="confirmaSenha" aria-label="Mostrar senha">
            <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="btnTrocar">Salvar e entrar</button>
    </form>

    <div class="hint" id="hintLogin">
      Primeiro acesso? Use a senha temporária que a chefia te passou &mdash; o sistema vai pedir para você criar uma senha própria.
    </div>

    <div class="back-link">
      <a href="index.html">&larr; Voltar para pagina inicial</a>
    </div>
  </div>

  <script>
    (function() {
      var saved = localStorage.getItem('alcateiaTheme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) document.body.classList.add('dark');
      document.documentElement.classList.remove('dark-init');
    })();

    if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
    var auth = firebase.auth();
    var db = firebase.database();

    var msg = document.getElementById('msg');
    var formLogin = document.getElementById('formLogin');
    var formSenha = document.getElementById('formSenha');
    var hintLogin = document.getElementById('hintLogin');
    var titulo = document.getElementById('tituloPainel');
    var subt = document.getElementById('subtitloPainel');
    var btnEntrar = document.getElementById('btnEntrar');
    var btnTrocar = document.getElementById('btnTrocar');

    function showMsg(txt, tipo) {
      msg.textContent = txt;
      msg.className = 'msg show ' + (tipo || 'error');
    }
    function clearMsg() { msg.className = 'msg'; }

    // Botões "mostrar senha"
    Array.prototype.forEach.call(document.querySelectorAll('.pw-toggle'), function(btn) {
      btn.addEventListener('click', function() {
        var input = document.getElementById(btn.getAttribute('data-target'));
        if (!input) return;
        var mostrar = input.type === 'password';
        input.type = mostrar ? 'text' : 'password';
        btn.classList.toggle('on', mostrar);
        btn.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
        input.focus();
      });
    });

    var ERROS = {
      'auth/invalid-email': 'E-mail inválido.',
      'auth/user-disabled': 'Esta conta está desativada. Fale com a administração.',
      'auth/user-not-found': 'E-mail ou senha incorretos.',
      'auth/wrong-password': 'E-mail ou senha incorretos.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente de novo.',
      'auth/network-request-failed': 'Sem conexão. Verifique sua internet.',
      'auth/weak-password': 'Senha muito fraca. Use pelo menos 8 caracteres.',
      'auth/requires-recent-login': 'Sessão expirada. Entre novamente para trocar a senha.'
    };
    function msgErro(e) {
      return (e && ERROS[e.code]) || ('Não foi possível continuar: ' + (e && e.message || 'erro desconhecido'));
    }

    function irParaPortal() { window.location.href = 'chefia.html'; }

    function mostrarTrocaSenha() {
      clearMsg();
      formLogin.style.display = 'none';
      hintLogin.style.display = 'none';
      formSenha.style.display = 'block';
      titulo.textContent = 'Crie sua senha';
      subt.textContent = 'Primeiro acesso — defina uma senha só sua';
      setTimeout(function(){ document.getElementById('novaSenha').focus(); }, 50);
    }

    // Verifica o cadastro do usuário no Realtime Database e decide o próximo passo.
    function verificarUsuario(user) {
      return db.ref('usuarios/' + user.uid).once('value').then(function(snap) {
        var u = snap.val();
        if (!u || u.ativo !== true) {
          return auth.signOut().then(function() {
            showMsg('Sua conta não está autorizada ou foi desativada. Fale com a administração.', 'error');
            resetBotoes();
          });
        }
        if (u.senhaProvisoria === true) {
          mostrarTrocaSenha();
          return;
        }
        irParaPortal();
      });
    }

    function resetBotoes() {
      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Entrar';
      btnTrocar.disabled = false;
      btnTrocar.textContent = 'Salvar e entrar';
    }

    // Se já há sessão ativa ao abrir a página, valida direto.
    auth.onAuthStateChanged(function(user) {
      if (user && formSenha.style.display === 'none' && formLogin.style.display !== 'none') {
        verificarUsuario(user).catch(function(e) { console.warn(e); });
      }
    });

    // ---- Login ----
    formLogin.addEventListener('submit', function(e) {
      e.preventDefault();
      clearMsg();
      btnEntrar.disabled = true;
      btnEntrar.textContent = 'Entrando...';
      var email = document.getElementById('email').value.trim().toLowerCase();
      var senha = document.getElementById('senha').value;
      auth.signInWithEmailAndPassword(email, senha)
        .then(function(cred) { return verificarUsuario(cred.user); })
        .catch(function(err) {
          console.warn(err);
          showMsg(msgErro(err), 'error');
          resetBotoes();
        });
    });

    // ---- Esqueci minha senha ----
    document.getElementById('btnEsqueci').addEventListener('click', function() {
      clearMsg();
      var email = document.getElementById('email').value.trim().toLowerCase();
      if (!email) {
        showMsg('Digite seu e-mail no campo acima e clique de novo em "Esqueci minha senha".', 'error');
        return;
      }
      auth.sendPasswordResetEmail(email).then(function() {
        showMsg('Se este e-mail estiver cadastrado, um link de redefinição foi enviado. Verifique sua caixa de entrada (e o spam).', 'ok');
      }).catch(function(err) {
        console.warn(err);
        showMsg(msgErro(err), 'error');
      });
    });

    // ---- Troca de senha obrigatória ----
    formSenha.addEventListener('submit', function(e) {
      e.preventDefault();
      clearMsg();
      var nova = document.getElementById('novaSenha').value;
      var conf = document.getElementById('confirmaSenha').value;
      if (nova.length < 8) { showMsg('A senha precisa ter pelo menos 8 caracteres.', 'error'); return; }
      if (nova !== conf) { showMsg('As senhas não conferem.', 'error'); return; }

      var user = auth.currentUser;
      if (!user) { showMsg('Sessão expirada. Entre novamente.', 'error'); return; }

      btnTrocar.disabled = true;
      btnTrocar.textContent = 'Salvando...';
      user.updatePassword(nova)
        .then(function() {
          return firebase.app().functions('southamerica-east1').httpsCallable('finalizarTrocaSenha')({});
        })
        .then(function() { irParaPortal(); })
        .catch(function(err) {
          console.warn(err);
          showMsg(msgErro(err), 'error');
          resetBotoes();
        });
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>

</html>
