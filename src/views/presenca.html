<div class="page-header">
  <div class="page-header-left">
    <h1>Controle de Presença</h1>
    <p>Alcateia Kotick — clique numa célula para alternar o status</p>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span class="badge badge-green">P = Presente</span>
    <span class="badge badge-red">A = Ausente</span>
    <span class="badge badge-yellow">FJ = Falta Justificada</span>
    <span class="badge badge-gray">· = vazio</span>
    <span style="font-size:12px;color:var(--text3)">— clique na célula para alterar</span>
    <button class="btn" onclick="openLobinhosModal()" style="font-size:12px;display:inline-flex;align-items:center;gap:6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Gerenciar lobinhos
    </button>
  </div>
</div>
<div class="stats-row" id="presence-stats"></div>

<div class="presenca-subtabs" role="tablist" aria-label="Filtrar lobinhos">
  <button class="com-subtab active" id="pres-subtab-todos" role="tab" aria-selected="true" onclick="showPresencaSubtab('todos')">
    Todos <span class="subtab-badge" id="pres-badge-todos">0</span>
  </button>
  <button class="com-subtab" id="pres-subtab-alerta" role="tab" aria-selected="false" onclick="showPresencaSubtab('alerta')">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    Abaixo de 75% <span class="subtab-badge subtab-badge-alert" id="pres-badge-alerta">0</span>
  </button>
</div>

<div class="card">
  <div class="scrollable-table">
    <table class="presence-table" id="pres-table">
      <thead><tr id="presenca-thead"></tr></thead>
      <tbody id="presenca-tbody"></tbody>
    </table>
  </div>
</div>
